name = "minerxrealm"
main = "worker.js"
compatibility_date = "2026-08-08"
workers_dev = true
# Per-version preview URLs are not used (deploys go straight to production) and would expose old versions.
preview_urls = false

[assets]
directory = "./frontend"
binding = "ASSETS"
# The page and all static files are served directly by Cloudflare without invoking the Worker
# (free, not counted as requests). The page's no-store header comes from frontend/_headers.
# Any path with no matching static file (/api/*, /telegram-webhook) still reaches the Worker.

[[d1_databases]]
binding = "DB"
database_name = "minerxrealm"
database_id = "9ebdd2c5-85f9-45d2-8d3b-0eb0f86ab0d3"

[[durable_objects.bindings]]
name = "DEPOSIT_CHECKER"
class_name = "DepositChecker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DepositChecker"]

# يشغّل scheduled() في worker.js (لا علاقة له بحصة الطلبات العادية):
# - "0 0 * * *"   كل يوم 00:00 UTC: يختار تركيبة Daily Combo الجديدة ويرسلها للأدمن فقط.
# - "5 0 * * FRI" الجمعة فقط 00:05 UTC (بعد تحديث اللوحة اليومي بخمس دقائق): يوزّع جوائز
#   Weekly Leaderboard، يحفظ الفائزين لـ Previous Winners، ويصفّر العدادين الأسبوعيين.
#   في Cloudflare الأحد = 1 والجمعة = 6، لذلك يُكتب اليوم بالاسم FRI وليس بالرقم.
[triggers]
crons = ["0 0 * * *", "5 0 * * FRI"]

# DEPOSIT_ADDRESS و TONCENTER_API_KEY (اختياري) يُضبطان كـ Cloudflare Secrets
# لا كـ [vars] — عبر: wrangler secret put DEPOSIT_ADDRESS
# (نفس أسلوب البوت السابق؛ env.DEPOSIT_ADDRESS يعمل بنفس الطريقة تماماً)

# ADSGRAM_REWARD_SECRET يُضبط كـ Cloudflare Secret أيضاً — عبر:
# wrangler secret put ADSGRAM_REWARD_SECRET
# نفس القيمة المُدرَجة في حقل Reward URL بلوحة تحكم Adsgram (?secret=...)

# GIGAPUB_POSTBACK_SECRET يُضبط كـ Cloudflare Secret أيضاً — عبر:
# wrangler secret put GIGAPUB_POSTBACK_SECRET
# نفس القيمة المُدرَجة في رابط Postback المُعطى لدعم GigaPub (&secret=...)
