name = "minerxrealm"
main = "worker.js"
compatibility_date = "2026-08-08"
workers_dev = true

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "minerxrealm"
database_id = "9ebdd2c5-85f9-45d2-8d3b-0eb0f86ab0d3"

[[durable_objects.bindings]]
name = "DEPOSIT_CHECKER"
class_name = "DepositChecker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DepositChecker"]

# يشغّل scheduled() في worker.js مرة واحدة يومياً بالضبط عند 00:00 UTC —
# يختار تركيبة Daily Combo الجديدة ويرسلها للأدمن فقط. استدعاء واحد
# باليوم، لا تكلفة إضافية ولا علاقة له بحصة الطلبات العادية.
[triggers]
crons = ["0 0 * * *"]

# DEPOSIT_ADDRESS و TONCENTER_API_KEY (اختياري) يُضبطان كـ Cloudflare Secrets
# لا كـ [vars] — عبر: wrangler secret put DEPOSIT_ADDRESS
# (نفس أسلوب البوت السابق؛ env.DEPOSIT_ADDRESS يعمل بنفس الطريقة تماماً)
